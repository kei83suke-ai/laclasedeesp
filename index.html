<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スペイン語教室</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css?v=5">
  
  <style>
    /* 画面全体の強制フィット */
    html, body, #app {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #content {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 100% !important;
      display: block !important;
    }

    /* ↓↓ 【ボタン反転・位置ズレの解決】CSSによる強制補正 ↓↓ */
    .flashcard {
      position: relative !important;
    }
    /* 裏面がひっくり返った時に、中のボタンが文字反転するのを防ぐ */
    .flashcard.flipped .card-face.back .card-review-btn {
      transform: rotateY(180deg) !important; /* カードの回転を打ち消して文字を正常に戻す */
      transform-origin: center !important;
      left: auto !important;
      right: 12px !important; /* 反転の裏返しを計算して、左下にピタッと固定 */
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="header-wrapper">
      <div class="navbar-main">
        <div class="logo-area">
          <div class="logo" onclick="appState.navigate('home')">🇪🇸 スペイン語教室</div>
          <a class="navbar-home-btn" href="#home">🏠 ホーム</a>
        </div>
        <a href="#" onclick="openFeedbackModal()" class="feedback-link">💡 訂正や追加があればここへ</a>
      </div>
      <nav class="app-menu-bar" id="app-menu-bar">
        <a class="menu-item" id="menu-nouns" href="#flashcards/nouns">🏷️ 名詞</a>
        <a class="menu-item" id="menu-verbs" href="#flashcards/verbs">🏃 動詞</a>
        <a class="menu-item" id="menu-adjectives" href="#flashcards/adjectives">✨ 形容詞</a>
        <a class="menu-item" id="menu-adverbs" href="#flashcards/adverbs">⏱️ 副詞</a>
        <a class="menu-item" id="menu-prepositions" href="#flashcards/prepositions">🔗 その他</a>
        <a class="menu-item" id="menu-conjugations" href="#conjugations">📊 活用表</a>
        <a class="menu-item" id="menu-scorecard" href="#scorecard">📈 成績表</a>
        <a class="menu-item" id="menu-reviewlater" href="#reviewlater">📝 復習単語</a>
      </nav>
    </header>

    <main id="content"></main>

    <div id="tts-status"></div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

  <script>
    // スマホ・PCの自動再生ブロックを確実に突破するシングル・インスタンス方式
    const audioPlayer1 = new Audio();
    const audioPlayer2 = new Audio();
    
    // スマホ対応：事前にユーザーアクションに紐づく形でプレイヤーを解放する処理
    document.addEventListener('click', () => {
      if (audioPlayer1.src === '') { audioPlayer1.play().catch(() => {}); }
      if (audioPlayer2.src === '') { audioPlayer2.play().catch(() => {}); }
    }, { once: true });

    window.playAudio = function(text) {
      if (!text) return;
      
      // 1. カッコ（文字）を綺麗に消去
      let cleanText = text.replace(/（.*?）/g, '').replace(/\(.*?\)/g, '').trim();
      
      // 2. 「el/la chico/chica」や「duro/dura」のようなスラッシュ混じりの単語を分解・整形
      if (cleanText.includes('/')) {
        cleanText = cleanText.replace(/\s*\/\s*/g, '/');
        const words = cleanText.split(' ');
        let sentenceM = [];
        let sentenceF = [];

        for (let w of words) {
          if (w.includes('/')) {
            const parts = w.split('/');
            const first = parts[0];
            const second = parts[1] || '';

            if (first === 'el' && second === 'la') {
              sentenceM.push('el'); sentenceF.push('la');
            } else if (first === 'un' && second === 'una') {
              sentenceM.push('un'); sentenceF.push('una');
            } else if (first === 'los' && second === 'las') {
              sentenceM.push('los'); sentenceF.push('las');
            } else if (second.length === 1) {
              if (first.endsWith('o')) {
                sentenceM.push(first); sentenceF.push(first.slice(0, -1) + second);
              } else if (first.endsWith('os')) {
                sentenceM.push(first); sentenceF.push(first.slice(0, -2) + second);
              } else {
                sentenceM.push(first); sentenceF.push(first);
              }
            } else {
              sentenceM.push(first); sentenceF.push(second);
            }
          } else {
            sentenceM.push(w); sentenceF.push(w);
          }
        }
        
        const mStr = sentenceM.join(' ');
        const fStr = sentenceF.join(' ');
        
        if (mStr !== fStr) {
          // 【超重要】男性形と女性形が違う場合、0.2秒あけて時間差再生する
          const urlM = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(mStr)}&tl=es&client=tw-ob`;
          const urlF = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(fStr)}&tl=es&client=tw-ob`;
          
          // 再生中の音声をクリア
          audioPlayer1.pause();
          audioPlayer2.pause();
          audioPlayer1.onended = null;
          
          // まず1つ目（男性形）を再生
          audioPlayer1.src = urlM;
          audioPlayer1.load();
          audioPlayer1.play().catch(e => console.log("Player1 error:", e));
          
          // 1つ目の再生が「終わった瞬間」を検知
          audioPlayer1.onended = function() {
            // ご希望通り、ここを200ミリ秒（0.2秒）に変更しました！
            setTimeout(() => {
              audioPlayer2.src = urlF;
              audioPlayer2.load();
              audioPlayer2.play().catch(e => console.log("Player2 error:", e));
            }, 200); 
          };
          return; 
        } else {
          cleanText = mStr;
        }
      }

      // 単一の単語（スラッシュがない普通の単語）は今まで通り一瞬で再生
      const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=es&client=tw-ob`;
      
      audioPlayer1.pause();
      audioPlayer2.pause();
      audioPlayer1.onended = null;
      
      audioPlayer1.src = googleTtsUrl;
      audioPlayer1.load();
      audioPlayer1.play().catch(e => console.log("Single play error:", e));
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スペイン語教室</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css?v=12">
  
  <style>
    /* 画面全体の強制フィット */
    html, body, #app {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #content {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 100% !important;
      display: block !important;
    }

/* 活用表コンテナ：PCで横並び、スマホで縦並び */
.conjugation-container {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: center;
  padding: 10px;
}

/* 各テーブルの枠組み */
.conjugation-table-wrapper {
  flex: 1 1 300px; /* 最小300pxで、PCでは横に並ぶ */
  max-width: 450px;
  margin-bottom: 20px;
}

/* テーブル全体の共通デザイン */
.conj-table, .imperative-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border: 1px solid #ccc;
  font-size: 0.9em;
}

/* 見出しとセルの共通デザイン */
.conj-table th, .conj-table td, 
.imperative-table th, .imperative-table td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
}

/* 命令形専用：否定命令の強調 */
.imperative-table .negativo th { background-color: #fff0f0; color: #d00; }
.imperative-table .negativo td { color: #d00; background-color: #fff9f9; font-weight: bold; }
    /* 活用表全体を画面内に収めるための共通設定 */
.conjugation-table-wrapper {
  width: 100%;
  overflow-x: auto;
  margin: 10px 0 20px 0;
}

/* 命令形専用のコンパクトな縦積みレイアウト */
.imperative-table {
  width: 100%;
  max-width: 450px; /* PCでも横に伸びすぎないように制限 */
  margin: 0 auto;
  border-collapse: collapse;
  background: #fff;
  border: 1px solid #ccc;
}

.imperative-table th {
  background-color: #f8f8f8;
  color: #555;
  width: 40%;
  padding: 10px;
  border: 1px solid #ddd;
  font-size: 0.9em;
}

.imperative-table td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
  font-weight: 600;
  cursor: pointer;
}

/* 否定命令（negativo）の行を赤系で強調 */
.imperative-table .negativo th {
  background-color: #fff0f0;
  color: #d00;
}

.imperative-table .negativo td {
  color: #d00;
  background-color: #fff9f9;
}

/* 活用表（通常版）もレスポンシブ対応 */
.conj-table {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  border-collapse: collapse;
}

.conj-table td {
  padding: 8px;
  border: 1px solid #eee;
  text-align: center;
}
  </style>
</head>
<body>
  <div id="app">
    <header class="header-wrapper">
      <div class="navbar-main">
        <div class="logo-area">
          <a class="navbar-home-btn" href="#home">🏠 ホーム</a>
          <div class="logo" onclick="appState.navigate('home')">🇪🇸 スペイン語教室</div>
        </div>
        <a href="#" onclick="openFeedbackModal(); return false" class="feedback-link">訂正フォーム</a>
      </div>
      <nav class="app-menu-bar" id="app-menu-bar">
        <a class="menu-item" id="menu-flashcards" href="#flashcards">📖 単語カード</a>
        <a class="menu-item" id="menu-conjugations" href="#conjugations">📊 活用表</a>
        <a class="menu-item" id="menu-study" href="#study">🎯 クイズ学習</a>
        <a class="menu-item" id="menu-reviewlater" href="#reviewlater">📝 復習単語</a>
        <a class="menu-item" id="menu-scorecard" href="#scorecard">📈 成績表</a>
      </nav>
    </header>

    <main id="content"></main>

    <div id="tts-status"></div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/learning.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
